<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Multi-model gateway request lifecycle</title>
  <desc id="desc">A request moves through authentication, canonical model routing, a provider channel and an SSE boundary. Provider retries stop before the first streamed byte.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="line" x1="92" y1="0" x2="1108" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="0.55" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#F97316" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity="0.05" />
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748B" />
    </marker>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)" />
    <rect width="1200" height="340" fill="url(#grid)" />

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
      <text x="42" y="48" fill="#67E8F9" font-size="12" font-weight="700" letter-spacing="2.5">MODEL GATEWAY / REQUEST LIFECYCLE</text>
      <text x="1158" y="48" fill="#64748B" font-size="11" font-weight="650" letter-spacing="1.5" text-anchor="end">SANITIZED VIEW</text>

      <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
        <line x1="196" y1="135" x2="251" y2="135" />
        <line x1="410" y1="135" x2="465" y2="135" />
        <line x1="624" y1="135" x2="679" y2="135" />
        <line x1="838" y1="135" x2="893" y2="135" />
        <line x1="1052" y1="135" x2="1107" y2="135" />
      </g>

      <g fill="#0F172A" stroke="#334155">
        <rect x="42" y="96" width="154" height="78" rx="13" />
        <rect x="256" y="96" width="154" height="78" rx="13" />
        <rect x="470" y="96" width="154" height="78" rx="13" />
        <rect x="684" y="96" width="154" height="78" rx="13" />
        <rect x="898" y="96" width="154" height="78" rx="13" />
        <rect x="1112" y="96" width="62" height="78" rx="13" />
      </g>

      <g text-anchor="middle">
        <text x="119" y="129" fill="#F8FAFC" font-size="14" font-weight="700">API CLIENT</text>
        <text x="119" y="151" fill="#64748B" font-size="10" letter-spacing="1">OPENAI / ANTHROPIC</text>

        <text x="333" y="129" fill="#F8FAFC" font-size="14" font-weight="700">AUTH + QUOTA</text>
        <text x="333" y="151" fill="#A78BFA" font-size="10" letter-spacing="1">RESERVE</text>

        <text x="547" y="129" fill="#F8FAFC" font-size="14" font-weight="700">MODEL ID</text>
        <text x="547" y="151" fill="#64748B" font-size="10" letter-spacing="1">CANONICAL</text>

        <text x="761" y="129" fill="#F8FAFC" font-size="14" font-weight="700">CHANNEL MATRIX</text>
        <text x="761" y="151" fill="#67E8F9" font-size="10" letter-spacing="1">FILTER + WEIGHT</text>

        <text x="975" y="129" fill="#F8FAFC" font-size="14" font-weight="700">PROVIDER</text>
        <text x="975" y="151" fill="#64748B" font-size="10" letter-spacing="1">KEY POOL</text>

        <text x="1143" y="129" fill="#F8FAFC" font-size="14" font-weight="700">SSE</text>
        <text x="1143" y="151" fill="#FDBA74" font-size="10" letter-spacing="1">OUT</text>
      </g>

      <line x1="1082" y1="70" x2="1082" y2="285" stroke="#F97316" stroke-width="2" stroke-dasharray="6 7" />
      <circle cx="1082" cy="135" r="6" fill="#F97316" />
      <text x="1062" y="213" fill="#FDBA74" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end">FIRST SSE BYTE</text>
      <text x="1062" y="235" fill="#94A3B8" font-size="12" text-anchor="end">Provider retries stop here</text>

      <path d="M333 196V256H975V196" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="4 5" />
      <g>
        <rect x="255" y="235" width="156" height="48" rx="12" fill="#161329" stroke="#6D4ACF" />
        <rect x="474" y="235" width="180" height="48" rx="12" fill="#0D1D27" stroke="#16859A" />
        <rect x="716" y="235" width="180" height="48" rx="12" fill="#1B1721" stroke="#9A5121" />
        <rect x="958" y="235" width="94" height="48" rx="12" fill="#172033" stroke="#475569" />

        <text x="333" y="264" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">RESERVE</text>
        <text x="564" y="264" fill="#67E8F9" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">ROUTE / FAILOVER</text>
        <text x="806" y="264" fill="#FDBA74" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">SETTLE / REFUND</text>
        <text x="1005" y="264" fill="#CBD5E1" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">AUDIT</text>
      </g>

      <text x="42" y="315" fill="#64748B" font-size="11" letter-spacing="0.6">ROUTING + ACCOUNTING + FAILURE BOUNDARIES IN ONE CHAIN</text>
    </g>
  </g>
</svg>
