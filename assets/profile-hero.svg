<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Liki Shi, frontend systems and AI products</title>
  <desc id="desc">A dark technical profile banner with a system diagram and four delivery metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B13" />
      <stop offset="0.55" stop-color="#101427" />
      <stop offset="1" stop-color="#0A1220" />
    </linearGradient>
    <linearGradient id="accent" x1="730" y1="60" x2="1110" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="0.5" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#F97316" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(945 170) rotate(90) scale(230 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.18" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="480" rx="24" />
    </clipPath>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="url(#background)" />
    <rect width="1200" height="480" fill="url(#grid)" />
    <rect x="640" width="560" height="340" fill="url(#glow)" />
    <circle cx="1150" cy="-20" r="210" fill="#8B5CF6" opacity="0.08" />
    <circle cx="650" cy="365" r="170" fill="#F97316" opacity="0.05" />

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
      <text x="58" y="72" fill="#67E8F9" font-size="14" font-weight="700" letter-spacing="3">LIKISHI / ENGINEER</text>
      <text x="54" y="158" fill="#F8FAFC" font-size="70" font-weight="760" letter-spacing="-2">LIKI SHI</text>
      <text x="58" y="205" fill="#CBD5E1" font-size="28" font-weight="520">Frontend systems + AI products</text>
      <text x="58" y="252" fill="#94A3B8" font-size="17">React clients · model gateways · streaming voice · native bridges</text>
      <text x="58" y="298" fill="#E2E8F0" font-size="14" font-weight="650" letter-spacing="2">SHANGHAI · 10 YEARS BUILDING SOFTWARE</text>

      <g stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <line x1="792" y1="103" x2="922" y2="160" />
        <line x1="1067" y1="103" x2="979" y2="160" />
        <line x1="792" y1="257" x2="922" y2="190" />
        <line x1="1067" y1="257" x2="979" y2="190" />
      </g>

      <g fill="#101827" stroke="#334155">
        <rect x="724" y="71" width="136" height="62" rx="14" />
        <rect x="1010" y="71" width="136" height="62" rx="14" />
        <rect x="724" y="226" width="136" height="62" rx="14" />
        <rect x="1010" y="226" width="136" height="62" rx="14" />
      </g>
      <g fill="#E2E8F0" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">
        <text x="792" y="108">UI STATE</text>
        <text x="1078" y="108">MODELS</text>
        <text x="792" y="263">VOICE</text>
        <text x="1078" y="263">NATIVE</text>
      </g>

      <circle cx="950" cy="175" r="67" fill="#0F172A" stroke="url(#accent)" stroke-width="3" filter="url(#softGlow)" />
      <text x="950" y="166" fill="#F8FAFC" font-size="36" font-weight="700" text-anchor="middle">λ</text>
      <text x="950" y="196" fill="#67E8F9" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SYSTEMS</text>

      <g fill="#22D3EE">
        <circle cx="858" cy="132" r="5" />
        <circle cx="1043" cy="126" r="5" />
      </g>
      <g fill="#F97316">
        <circle cx="862" cy="222" r="5" />
        <circle cx="1042" cy="224" r="5" />
      </g>

      <g>
        <rect x="36" y="360" width="270" height="88" rx="16" fill="#0D1321" stroke="#273449" />
        <rect x="322" y="360" width="270" height="88" rx="16" fill="#0D1321" stroke="#273449" />
        <rect x="608" y="360" width="270" height="88" rx="16" fill="#0D1321" stroke="#273449" />
        <rect x="894" y="360" width="270" height="88" rx="16" fill="#0D1321" stroke="#273449" />

        <text x="58" y="400" fill="#F8FAFC" font-size="26" font-weight="760">10 YEARS</text>
        <text x="58" y="426" fill="#94A3B8" font-size="11" font-weight="650" letter-spacing="1.5">WEB + CROSS PLATFORM</text>

        <text x="344" y="400" fill="#C4B5FD" font-size="26" font-weight="760">10+</text>
        <text x="344" y="426" fill="#94A3B8" font-size="11" font-weight="650" letter-spacing="1.5">AI WORKBENCHES</text>

        <text x="630" y="400" fill="#67E8F9" font-size="26" font-weight="760">1,000+</text>
        <text x="630" y="426" fill="#94A3B8" font-size="11" font-weight="650" letter-spacing="1.5">STORES SERVED</text>

        <text x="916" y="400" fill="#FDBA74" font-size="26" font-weight="760">7% → 1%</text>
        <text x="916" y="426" fill="#94A3B8" font-size="11" font-weight="650" letter-spacing="1.5">HYBRID CRASH RATE</text>
      </g>
    </g>
  </g>
</svg>
